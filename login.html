<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBUC Admin Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0a0e1a;
            position: relative;
        }

        /* ─── Animated Gradient Background ─── */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1a3e 30%, #16213e 60%, #0f3460 100%);
            background-size: 400% 400%;
            animation: gradientShift 18s ease-in-out infinite alternate;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ─── Floating Orbs ─── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: 0;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #6366f1, #8b5cf6);
            top: -15%;
            left: -10%;
            animation-duration: 14s;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #3b82f6, #06b6d4);
            bottom: -20%;
            right: -10%;
            animation-duration: 16s;
            animation-delay: -3s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #a78bfa, #ec4899);
            top: 40%;
            left: 55%;
            animation-duration: 18s;
            animation-delay: -6s;
            opacity: 0.3;
        }

        .orb-4 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #34d399, #06b6d4);
            bottom: 10%;
            left: 20%;
            animation-duration: 13s;
            animation-delay: -4s;
            opacity: 0.25;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 50px) scale(0.9);
            }
            100% {
                transform: translate(40px, -20px) scale(1.05);
            }
        }

        /* ─── Grid Overlay ─── */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* ─── Card ─── */
        .card {
            position: relative;
            z-index: 1;
            width: 95%;
            max-width: 440px;
            padding: 44px 38px 38px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(28px) saturate(1.3);
            -webkit-backdrop-filter: blur(28px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardFade 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Glow border ring */
        .card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 34px;
            padding: 2px;
            background: conic-gradient(from 0deg, transparent, rgba(99, 102, 241, 0.3), rgba(59, 130, 246, 0.4), rgba(168, 85, 247, 0.3), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.6;
            animation: borderSpin 10s linear infinite;
        }

        @keyframes borderSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes cardFade {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ─── Logo ─── */
        .logo-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(59, 130, 246, 0.15));
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.5s ease;
        }

        .logo-wrap:hover {
            transform: scale(1.04) rotate(-2deg);
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            display: block;
            background: rgba(255, 255, 255, 0.04);
        }

        /* ─── Title ─── */
        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 400;
            margin-top: -2px;
            margin-bottom: 30px;
            letter-spacing: 0.3px;
        }

        /* ─── Input Groups ─── */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group .icon-left {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 15px;
            transition: color 0.3s ease;
            pointer-events: none;
        }

        .input-group:focus-within .icon-left {
            color: #a5b4fc;
        }

        .input-group input {
            width: 100%;
            height: 54px;
            padding: 0 48px 0 46px;
            border: none;
            outline: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 15px;
            font-weight: 400;
            transition: background 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 300;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(165, 180, 252, 0.25);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
        }

        .input-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(20, 20, 50, 0.9) inset !important;
            -webkit-text-fill-color: #fff !important;
        }

        .eye {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .eye:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ─── Options ─── */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 26px;
            margin-top: 4px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .options label:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .options input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #818cf8;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .options input[type="checkbox"]:hover {
            opacity: 1;
        }

        .options a {
            color: rgba(165, 180, 252, 0.7);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .options a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        /* ─── Button ─── */
        .btn-login {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 30px rgba(79, 70, 229, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.08) 100%);
            pointer-events: none;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 45px rgba(79, 70, 229, 0.4);
            background: linear-gradient(135deg, #818cf8, #4f46e5);
        }

        .btn-login:active {
            transform: translateY(0px) scale(0.98);
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
        }

        .btn-login i {
            margin-right: 8px;
            font-size: 14px;
        }

        /* ─── Error ─── */
        .error {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 400;
            min-height: 24px;
            transition: all 0.3s ease;
        }

        /* ─── Footer ─── */
        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.4px;
            font-weight: 300;
        }

        .footer span {
            opacity: 0.5;
            margin: 0 6px;
        }

        /* ─── Responsive ─── */
        @media (max-width: 500px) {
            .card {
                padding: 32px 22px 28px;
                border-radius: 24px;
            }

            .title {
                font-size: 24px;
            }

            .sub {
                font-size: 13px;
            }

            .logo-wrap {
                width: 72px;
                height: 72px;
            }

            .input-group input {
                height: 48px;
                font-size: 14px;
                padding: 0 44px 0 42px;
            }

            .btn-login {
                height: 50px;
                font-size: 15px;
            }

            .options {
                font-size: 12.5px;
                flex-wrap: wrap;
                gap: 6px 0;
            }

            .orb-1,
            .orb-2 {
                width: 300px;
                height: 300px;
            }

            .orb-3 {
                width: 200px;
                height: 200px;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 24px 16px 22px;
            }

            .logo-wrap {
                width: 60px;
                height: 60px;
            }

            .title {
                font-size: 20px;
            }

            .input-group input {
                height: 44px;
                font-size: 13px;
                padding: 0 38px 0 36px;
            }

            .input-group .icon-left {
                left: 12px;
                font-size: 13px;
            }

            .eye {
                right: 12px;
                font-size: 14px;
            }

            .btn-login {
                height: 44px;
                font-size: 14px;
            }
        }

        /* ─── Scrollbar hide ─── */
        ::-webkit-scrollbar {
            width: 0;
        }
    </style>
</head>
<body>

    <!-- ─── Background ─── -->
    <div class="bg-canvas"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="grid-overlay"></div>

    <!-- ─── Card ─── -->
    <div class="card">

        <!-- Logo -->
        <div class="logo-wrap">
            <img src="https://hbuc.edu.bd/admin/uploads/nu-theme-1/logo.svg" alt="HBUC Logo" />
        </div>

        <h1 class="title">HBUC Admin</h1>
        <p class="sub">Habibullah Bahar College · Admin Panel</p>

        <form id="loginForm">

            <!-- Username -->
            <div class="input-group">
                <i class="fa-solid fa-user icon-left"></i>
                <input
                type="text"
                id="username"
                placeholder="Username"
                required
                autocomplete="username"
                />
            </div>

            <!-- Password -->
            <div class="input-group">
                <i class="fa-solid fa-lock icon-left"></i>
                <input
                type="password"
                id="password"
                placeholder="Password"
                required
                autocomplete="current-password"
                />
                <i class="fa-solid fa-eye eye" id="togglePassword"></i>
            </div>

            <!-- Options -->
            <div class="options">
                <label>
                    <input type="checkbox" />
                    Remember Me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn-login">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> LOGIN
            </button>

            <div class="error" id="error"></div>

        </form>

        <div class="footer">
            &copy; 2026 <span>·</span> Habibullah Bahar College
        </div>

    </div>

    <!-- ─── Script ─── -->
    <script>
        // ─── Credentials ───
        const ADMIN_USERNAME = "611";
        const ADMIN_PASSWORD = "611";
        const DASHBOARD = "https://hbuc-d.netlify.app/";

        // ─── DOM refs ───
        const form = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const errorEl = document.getElementById("error");
        const toggleEye = document.getElementById("togglePassword");

        // ─── Login ───
        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const user = usernameInput.value.trim();
            const pass = passwordInput.value;

            if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
                errorEl.style.color = "#6ee7b7";
                errorEl.innerHTML = '<i class="fa-solid fa-check-circle" style="margin-right:6px;"></i> Login Successful...';
                errorEl.style.opacity = "1";

                setTimeout(() => {
                    window.location.href = DASHBOARD;
                }, 800);
            } else {
                errorEl.style.color = "#fca5a5";
                errorEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="margin-right:6px;"></i> Invalid Username or Password';
                errorEl.style.opacity = "1";

                // Shake animation (simple)
                form.style.animation = "shake 0.4s ease";
                setTimeout(() => {
                    form.style.animation = "";
                }, 400);
            }
        });

        // ─── Toggle Password ───
        toggleEye.addEventListener("click", function() {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            this.classList.toggle("fa-eye");
            this.classList.toggle("fa-eye-slash");
        });

        // ─── Shake keyframe (injected) ───
        const styleShake = document.createElement("style");
        styleShake.textContent = `
                    @keyframes shake {
                        0%, 100% { transform: translateX(0); }
                        20% { transform: translateX(-10px); }
                        40% { transform: translateX(10px); }
                        60% { transform: translateX(-6px); }
                        80% { transform: translateX(6px); }
                    }
                `;
        document.head.appendChild(styleShake);

        // ─── Clear error on focus ───
        usernameInput.addEventListener("focus", () => {
            errorEl.innerHTML = "";
            errorEl.style.opacity = "0";
        });
        passwordInput.addEventListener("focus", () => {
            errorEl.innerHTML = "";
            errorEl.style.opacity = "0";
        });
    </script>

</body>
</html>
