<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel – Manage Teachers</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f5f7fb;
            padding: 20px;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: #001a5c;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-family: Georgia, serif;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* ── Form ── */
        .form-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .1);
            height: fit-content;
        }
        .form-box h2 {
            color: #001a5c;
            margin-bottom: 20px;
            font-family: Georgia, serif;
            border-bottom: 2px solid #f7c948;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            margin-bottom: 4px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 15px;
        }
        .input-group input:focus {
            border-color: #001a5c;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            width: 100%;
            padding: 12px;
            background: #26166f;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
            margin-top: 8px;
        }
        button:hover {
            background: #f7c948;
            color: #26166f;
        }
        .btn-cancel {
            background: #6c757d;
            margin-top: 5px;
        }
        .btn-cancel:hover {
            background: #5a6268;
            color: white;
        }

        /* ── Table ── */
        .data-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .1);
            overflow-x: auto;
        }
        .data-box h2 {
            color: #001a5c;
            margin-bottom: 20px;
            font-family: Georgia, serif;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th,
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #001a5c;
            color: white;
        }
        td img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 50%;
        }
        .btn-action {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 4px;
        }
        .btn-edit {
            background: #f0ad4e;
            color: white;
        }
        .btn-edit:hover {
            background: #ec971f;
        }
        .btn-delete {
            background: #d9534f;
            color: white;
        }
        .btn-delete:hover {
            background: #c9302c;
        }
        .empty-row td {
            text-align: center;
            padding: 30px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>Teacher Management – Admin Panel</h1>
            <p>Add, Edit, or Delete Teachers – changes appear instantly on the user page</p>
        </header>

        <div class="main-content">

            <!-- Form -->
            <div class="form-box">
                <h2 id="formTitle">Add New Teacher</h2>
                <form id="teacherForm">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="e.g. Shahadat Hossain" />
                    </div>
                    <div class="input-group">
                        <label>Designation</label>
                        <input type="text" id="designation" placeholder="e.g. Assistant Professor" />
                    </div>
                    <div class="input-group">
                        <label>Subject / Course</label>
                        <input type="text" id="subject" placeholder="e.g. Principles of Finance" />
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label>Phone</label>
                            <input type="text" id="phone" placeholder="e.g. 01689801308" />
                        </div>
                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" id="email" placeholder="e.g. name@gmail.com" />
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Department</label>
                        <input type="text" id="department" placeholder="e.g. Department of Finance" />
                    </div>
                    <div class="input-group">
                        <label>Image URL</label>
                        <input type="url" id="imageUrl" placeholder="Paste direct image link" />
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label>Facebook URL</label>
                            <input type="url" id="facebook" placeholder="https://facebook.com/..." />
                        </div>
                        <div class="input-group">
                            <label>LinkedIn URL</label>
                            <input type="url" id="linkedin" placeholder="https://linkedin.com/..." />
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Custom Email Link (optional)</label>
                        <input type="url" id="emailLink" placeholder="mailto:... or contact page" />
                    </div>

                    <button type="submit" id="submitBtn">Save Teacher</button>
                    <button type="button" id="cancelBtn" class="btn-cancel" style="display:none;">Cancel Edit</button>
                </form>
            </div>

            <!-- Table -->
            <div class="data-box">
                <h2>Current Teachers</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name / Designation</th>
                            <th>Subject</th>
                            <th>Department</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="teachersTableBody">
                        <tr class="empty-row"><td colspan="5">Loading teachers…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        // ─── IMPORTS ────────────────────────────────────────
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            doc,
            addDoc,
            setDoc,
            deleteDoc,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import {
            getDatabase,
            ref,
            set,
            remove
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        // ─── CONFIG ────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyCEQ31b4AnS3QgXOkNaLN0cbBh0WTAzz6k",
            authDomain: "hbuc-teachcer.firebaseapp.com",
            databaseURL: "https://hbuc-teachcer-default-rtdb.firebaseio.com",
            projectId: "hbuc-teachcer",
            storageBucket: "hbuc-teachcer.firebasestorage.app",
            messagingSenderId: "482109695307",
            appId: "1:482109695307:web:b5bd4adeaf57fc47cd34ce",
            measurementId: "G-4X6LKDGD34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);
        console.log("✅ Firebase initialized");

        // ─── DOM refs ──────────────────────────────────────
        const form = document.getElementById('teacherForm');
        const nameInp = document.getElementById('name');
        const designationInp = document.getElementById('designation');
        const subjectInp = document.getElementById('subject');
        const phoneInp = document.getElementById('phone');
        const emailInp = document.getElementById('email');
        const departmentInp = document.getElementById('department');
        const imageUrlInp = document.getElementById('imageUrl');
        const facebookInp = document.getElementById('facebook');
        const linkedinInp = document.getElementById('linkedin');
        const emailLinkInp = document.getElementById('emailLink');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const formTitle = document.getElementById('formTitle');
        const tableBody = document.getElementById('teachersTableBody');

        // ─── State ──────────────────────────────────────────
        let editingId = null; // null = add mode

        // ─── Reset form ─────────────────────────────────────
        function resetForm() {
            form.reset();
            editingId = null;
            submitBtn.textContent = 'Save Teacher';
            formTitle.textContent = 'Add New Teacher';
            cancelBtn.style.display = 'none';
        }

        // ─── Fill form with teacher data ────────────────────
        function fillForm(teacher) {
            nameInp.value = teacher.name || '';
            designationInp.value = teacher.designation || teacher.title || '';
            subjectInp.value = teacher.subject || '';
            phoneInp.value = teacher.phone || '';
            emailInp.value = teacher.email || '';
            departmentInp.value = teacher.department || teacher.dept || '';
            imageUrlInp.value = teacher.imageUrl || teacher.img || '';
            facebookInp.value = teacher.facebook || '';
            linkedinInp.value = teacher.linkedin || '';
            emailLinkInp.value = teacher.emailLink || '';
        }

        // ─── Save / Update ──────────────────────────────────
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                name: nameInp.value.trim() || '',
                designation: designationInp.value.trim() || '',
                subject: subjectInp.value.trim() || '',
                phone: phoneInp.value.trim() || '',
                email: emailInp.value.trim() || '',
                department: departmentInp.value.trim() || '',
                imageUrl: imageUrlInp.value.trim() || '',
                facebook: facebookInp.value.trim() || '#',
                linkedin: linkedinInp.value.trim() || '#',
                emailLink: emailLinkInp.value.trim() || (emailInp.value ? `mailto:${emailInp.value}` : '#')
            };

            try {
                if (editingId) {
                    const docRef = doc(db, 'teachers', editingId);
                    await setDoc(docRef, data, { merge: true });
                    await set(ref(rtdb, 'teachers/' + editingId), data);
                    alert('Teacher updated successfully!');
                } else {
                    const docRef = await addDoc(collection(db, 'teachers'), data);
                    await set(ref(rtdb, 'teachers/' + docRef.id), data);
                    alert('Teacher added successfully!');
                }
                resetForm();
            } catch (error) {
                console.error('Error saving teacher:', error);
                alert('Something went wrong. Check console.');
            }
        });

        // ─── Cancel edit ────────────────────────────────────
        cancelBtn.addEventListener('click', resetForm);

        // ─── Delete teacher ─────────────────────────────────
        async function deleteTeacher(id) {
            if (!confirm('Are you sure you want to delete this teacher?')) return;
            try {
                await deleteDoc(doc(db, 'teachers', id));
                await remove(ref(rtdb, 'teachers/' + id));
                alert('Teacher deleted.');
            } catch (error) {
                console.error('Delete error:', error);
                alert('Delete failed.');
            }
        }

        // ─── Edit teacher ───────────────────────────────────
        function editTeacher(id, data) {
            editingId = id;
            fillForm(data);
            submitBtn.textContent = 'Update Teacher';
            formTitle.textContent = 'Edit Teacher';
            cancelBtn.style.display = 'block';
            document.querySelector('.form-box').scrollIntoView({ behavior: 'smooth' });
        }

        // ─── Render table ──────────────────────────────────
        function renderTable(teachers) {
            if (!teachers || teachers.length === 0) {
                tableBody.innerHTML = `<tr class="empty-row"><td colspan="5">No teachers found. Add one!</td></tr>`;
                return;
            }

            let html = '';
            teachers.forEach(teacher => {
                const id = teacher.id;
                const img = teacher.imageUrl || teacher.img || '';
                const name = teacher.name || 'Unknown';
                const designation = teacher.designation || teacher.title || '';
                const subject = teacher.subject || '';
                const department = teacher.department || teacher.dept || '';

                html += `
                    <tr>
                        <td><img src="${img}" alt="${name}" onerror="this.style.display='none'" /></td>
                        <td><strong>${name}</strong><br /><small>${designation}</small></td>
                        <td>${subject}</td>
                        <td>${department}</td>
                        <td>
                            <button class="btn-action btn-edit" data-id="${id}"><i class="fas fa-edit"></i></button>
                            <button class="btn-action btn-delete" data-id="${id}"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;

            tableBody.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const teacher = teachers.find(t => t.id === id);
                    if (teacher) editTeacher(id, teacher);
                });
            });
            tableBody.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => {
                    deleteTeacher(btn.dataset.id);
                });
            });
        }

        // ─── Real-time listener ────────────────────────────
        onSnapshot(collection(db, 'teachers'), (snapshot) => {
            if (snapshot.empty) {
                renderTable([]);
                return;
            }
            const teachers = [];
            snapshot.forEach(doc => {
                teachers.push({ id: doc.id, ...doc.data() });
            });
            teachers.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            renderTable(teachers);
        }, (error) => {
            console.error('Firestore listener error:', error);
            tableBody.innerHTML = `<tr class="empty-row"><td colspan="5">⚠️ Error loading teachers. Refresh.</td></tr>`;
        });

        resetForm();
    </script>

</body>
</html>
