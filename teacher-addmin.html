<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Manage Teachers</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f5f7fb;
padding:20px;
}

.admin-container{
max-width:1200px;
margin:0 auto;
}

header{
background:#001a5c;
color:white;
padding:20px;
border-radius:10px;
text-align:center;
margin-bottom:30px;
}

header h1{
font-family:Georgia,serif;
}

.main-content{
display:grid;
grid-template-columns:1fr 2fr;
gap:30px;
}

@media(max-width:900px){
.main-content{
grid-template-columns:1fr;
}
}

/* Form Style */
.form-box{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
height:fit-content;
}

.form-box h2{
color:#001a5c;
margin-bottom:20px;
font-family:Georgia,serif;
border-bottom:2px solid #f7c948;
padding-bottom:10px;
}

.input-group{
margin-bottom:15px;
}

.input-group label{
display:block;
margin-bottom:5px;
color:#333;
font-weight:600;
font-size:14px;
}

.input-group input, .input-group select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
outline:none;
font-size:15px;
}

.input-group input:focus{
border-color:#001a5c;
}

button{
width:100%;
padding:12px;
background:#26166f;
color:white;
border:none;
border-radius:5px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#f7c948;
color:#26166f;
}

/* Table Style */
.data-box{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
overflow-x:auto;
}

.data-box h2{
color:#001a5c;
margin-bottom:20px;
font-family:Georgia,serif;
}

table{
width:100%;
border-collapse:collapse;
text-align:left;
}

th, td{
padding:12px 15px;
border-bottom:1px solid #ddd;
}

th{
background:#001a5c;
color:white;
}

td img{
width:50px;
height:50px;
object-fit:cover;
border-radius:50%;
}

.btn-delete{
background:#d9534f;
color:white;
padding:6px 12px;
border:none;
border-radius:4px;
cursor:pointer;
}

.btn-delete:hover{
background:#c9302c;
}
</style>
</head>
<body>

<div class="admin-container">
<header>
<h1>Teacher Management - Admin Panel</h1>
<p>Add, View, and Delete Teachers from Firebase Database</p>
</header>

<div class="main-content">
<div class="form-box">
<h2>Add New Teacher</h2>
<form id="teacherForm">
<div class="input-group">
<label>Full Name</label>
<input type="text" id="name" required placeholder="Ex: Shahadat Hossain">
</div>
<div class="input-group">
<label>Designation</label>
<input type="text" id="designation" required placeholder="Ex: Assistant Professor">
</div>
<div class="input-group">
<label>Subject / Course</label>
<input type="text" id="subject" required placeholder="Ex: Principles of finance">
</div>
<div class="input-group">
<label>Phone Number</label>
<input type="text" id="phone" required placeholder="Ex: 01689801XXX">
</div>
<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" placeholder="Ex: name@gmail.com">
</div>
<div class="input-group">
<label>Department</label>
<input type="text" id="department" required placeholder="Ex: Department of Finance">
</div>
<div class="input-group">
<label>Image URL</label>
<input type="url" id="imageUrl" required placeholder="Paste image online link/URL">
</div>
<button type="submit">Save Teacher</button>
</form>
</div>

<div class="data-box">
<h2>Current Teachers List</h2>
<table>
<thead>
<tr>
<th>Image</th>
<th>Name</th>
<th>Designation & Subject</th>
<th>Department</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="teachersTableBody">
</tbody>
</table>
</div>
</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
  import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

  // আপনার দেওয়া Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCEQ31b4AnS3QgXOkNaLN0cbBh0WTAzz6k",
    authDomain: "hbuc-teachcer.firebaseapp.com",
    databaseURL: "https://hbuc-teachcer-default-rtdb.firebaseio.com",
    projectId: "hbuc-teachcer",
    storageBucket: "hbuc-teachcer.firebasestorage.app",
    messagingSenderId: "482109695307",
    appId: "1:482109695307:web:b5bd4adeaf57fc47cd34ce",
    measurementId: "G-4X6LKDGD34"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const rtdb = getDatabase(app);

  const teacherForm = document.getElementById('teacherForm');
  const tableBody = document.getElementById('teachersTableBody');

  // ১. ডেটাবেজে নতুন টিচার ডাটা সাবমিট করা (Firestore & Realtime Database both)
  teacherForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const teacherData = {
      name: document.getElementById('name').value,
      designation: document.getElementById('designation').value,
      subject: document.getElementById('subject').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value || "N/A",
      department: document.getElementById('department').value,
      imageUrl: document.getElementById('imageUrl').value,
      createdAt: new Date().toISOString()
    };

    try {
      // Firestore-এ সেভ করা
      const docRef = await addDoc(collection(db, "teachers"), teacherData);
      
      // Realtime Database-এও একই ID দিয়ে ব্যাকআপ বা সেভ করা
      await set(ref(rtdb, 'teachers/' + docRef.id), teacherData);

      alert("Teacher added successfully to both databases!");
      teacherForm.reset();
    } catch (error) {
      console.error("Error adding document: ", error);
      alert("Something went wrong! Check console.");
    }
  });

  // ২. ফায়ারবেস (Firestore) থেকে রিয়েলটাইম ডাটা তুলে এনে টেবিলে দেখানো
  onSnapshot(collection(db, "teachers"), (snapshot) => {
    tableBody.innerHTML = ""; // টেবিল ক্লিয়ার করা
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;

      const row = `
        <tr>
          <td><img src="${data.imageUrl}" alt="photo"></td>
          <td><strong>${data.name}</strong><br><small>${data.email}</small></td>
          <td>${data.designation}<br><small>(${data.subject})</small></td>
          <td>${data.department}</td>
          <td>
            <button class="btn-delete" data-id="${id}"><i class="fas fa-trash"></i> Delete</button>
          </td>
        </tr>
      `;
      tableBody.innerHTML += row;
    });

    // ডিলিট বাটনে ক্লিক ইভেন্ট সেট করা
    const deleteButtons = document.querySelectorAll('.btn-delete');
    deleteButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const docId = btn.getAttribute('data-id');
        deleteTeacher(docId);
      });
    });
  });

  // ৩. ডাটা ডিলিট করার ফাংশন (Firestore & Realtime Database both)
  async function deleteTeacher(id) {
    if(confirm("Are you sure you want to delete this teacher?")) {
      try {
        // Firestore থেকে ডিলিট
        await deleteDoc(doc(db, "teachers", id));
        // Realtime Database থেকে ডিলিট
        await remove(ref(rtdb, 'teachers/' + id));
        alert("Teacher deleted successfully!");
      } catch (error) {
        console.error("Error deleting document: ", error);
      }
    }
  }
</script>

</body>
</html>
