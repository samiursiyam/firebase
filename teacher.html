<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Font Awesome -->

    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f5f7fb;
        }

        /* ── Hero ── */
        .hero {
            background: linear-gradient(rgba(0, 20, 70, .85), rgba(0, 20, 70, .85)),
                url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f");
            background-size: cover;
            background-position: center;
            padding: 70px 20px;
            text-align: center;
            color: white;
            position: relative;
        }

        .hero h1 {
            font-size: 60px;
            font-family: Georgia, serif;
        }

        .hero span {
            color: #f7c948;
        }

        .line {
            width: 120px;
            height: 3px;
            background: #f7c948;
            margin: 15px auto;
        }

        .hero p {
            font-size: 18px;
            opacity: .9;
        }

        /* ── Visitor Badge ── */
        .visitor-badge {
            display: inline-block;
            margin-top: 20px;
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(4px);
            padding: 10px 28px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, .25);
            font-size: 16px;
            letter-spacing: .5px;
        }
        .visitor-badge i {
            color: #f7c948;
            margin-right: 10px;
        }
        .visitor-badge span {
            font-weight: 700;
            font-size: 20px;
            color: #f7c948;
        }

        /* ── Cards Grid ── */
        .container {
            max-width: 1400px;
            margin: 50px auto;
            padding: 0 70px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        /* ── Card ── */
        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
            transition: .4s;
        }
        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .info {
            background: #26166f;
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        .cap {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 55px;
            background: #26166f;
            border: 3px solid #f7c948;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: #f7c948;
        }

        .info h2 {
            font-size: 30px;
            font-family: Georgia, serif;
            margin-top: 10px;
        }

        .info h3 {
            color: #f7c948;
            margin: 8px 0 15px;
            font-size: 18px;
        }

        .info h6 {
            font-size: 14px;
            font-weight: 400;
            opacity: .85;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .info hr {
            border: none;
            height: 1px;
            background: #f7c948;
            width: 70%;
            margin: 15px auto;
        }

        .contact {
            text-align: left;
            margin-top: 15px;
        }
        .contact p {
            margin: 10px 0;
            font-size: 15px;
        }
        .contact i {
            color: #f7c948;
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .social {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .social a {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, .1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-decoration: none;
            transition: .3s;
        }
        .social a:hover {
            background: #f7c948;
            color: #26166f;
        }

        /* ── Quote ── */
        .quote {
            text-align: center;
            padding: 40px 20px;
            color: #1c2b5a;
            font-style: italic;
            font-size: 22px;
        }

        /* ── Footer ── */
        .footer {
            background: #001a5c;
            color: white;
            padding: 25px;
            text-align: center;
        }

        /* ── Loading ── */
        .loading-txt {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            font-size: 20px;
            color: #555;
        }
        .loading-txt i {
            margin-right: 12px;
            color: #f7c948;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 40px;
            }
            .container {
                padding: 0 20px;
            }
            .visitor-badge {
                font-size: 14px;
                padding: 8px 18px;
            }
        }
    </style>
</head>

        // ─── 5. FILL FIRESTORE WITH DEFAULT DATA (if empty) ──
        async function seedFirestoreIfEmpty() {
            try {
                const colRef = collection(db, "teachers");
                const snapshot = await getDocs(colRef);

                if (snapshot.empty) {
                    console.log("📦 Firestore is leeg – seeden met standaard data…");
                    for (const t of defaultTeachers) {
                        const docRef = doc(db, "teachers", t.id);
                        await setDoc(docRef, {
                            name: t.name,
                            title: t.title,
                            subject: t.subject,
                            phone: t.phone || "",
                            email: t.email || "",
                            dept: t.dept,
                            img: t.img,
                            facebook: t.facebook || "#",
                            linkedin: t.linkedin || "#",
                            emailLink: t.emailLink || "#"
                        });
                    }
                    console.log("✅ Firestore seeding voltooid!");
                    return defaultTeachers;
                } else {
                    console.log("📄 Firestore bevat al data – laden…");
                    const teachers = [];
                    snapshot.forEach(doc => {
                        teachers.push({ id: doc.id, ...doc.data() });
                    });
                    // sorteer op naam voor consistente volgorde
                    teachers.sort((a, b) => a.name.localeCompare(b.name));
                    return teachers;
                }
            } catch (err) {
                console.warn("⚠️ Firestore seed fout, gebruik default data:", err);
                return defaultTeachers;
            }
        }


        // ─── 6. RENDER CARDS ──────────────────────────────
        function renderCards(teachers) {
            const container = document.getElementById("teacherContainer");
            if (!teachers || teachers.length === 0) {
                container.innerHTML = `
                    <div class="loading-txt">
                        <i class="fas fa-exclamation-circle"></i> No teachers found.
                    </div>
                `;
                return;
            }

            let html = "";
            for (const t of teachers) {
                // veilige fallback voor ontbrekende velden
                const name = t.name || "Unknown";
                const title = t.title || "Faculty";
                const subject = t.subject || "";
                const phone = t.phone || "";
                const email = t.email || "";
                const dept = t.dept || "Department";
                const img = t.img || "https://via.placeholder.com/400x320/26166f/fff?text=Faculty";
                const fb = t.facebook || "#";
                const li = t.linkedin || "#";
                const em = t.emailLink || (email ? `mailto:${email}` : "#");

                html += `
                    <div class="card">
                        <img src="${img}" alt="${name}" loading="lazy" />
                        <div class="info">
                            <div class="cap"><i class="fas fa-graduation-cap"></i></div>
                            <h2>${name}</h2>
                            <h3>${title}</h3>
                            ${subject ? `<h6>${subject}</h6>` : ""}
                            <hr />
                            <div class="contact">
                                ${phone ? `<p><i class="fas fa-phone"></i>${phone}</p>` : ""}
                                ${email ? `<p><i class="fas fa-envelope"></i>${email}</p>` : ""}
                                <p><i class="fas fa-location-dot"></i>${dept}</p>
                            </div>
                            <div class="social">
                                <a href="${fb}" target="_blank"><i class="fab fa-facebook-f"></i></a>
                                <a href="${li}" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                                <a href="${em}" target="_blank"><i class="fas fa-envelope"></i></a>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }


        // ─── 7. LIVE VISITOR COUNTER (Realtime Database) ──
        function setupVisitorCounter() {
            const countEl = document.getElementById("visitorCount");
            const counterRef = ref(rtdb, "visitors");

            // Eerst: huidige waarde ophalen en +1 doen (atomic increment)
            // We gebruiken `update` met een increment
            update(counterRef, { count: increment(1) })
                .then(() => {
                    // Luister naar veranderingen
                    onValue(counterRef, (snapshot) => {
                        const data = snapshot.val();
                        const count = data?.count ?? 0;
                        countEl.textContent = count;
                    }, (err) => {
                        console.warn("⚠️ Realtime DB error:", err);
                        countEl.textContent = "💥";
                    });
                })
                .catch((err) => {
                    console.warn("⚠️ Kon visitor niet incrementen:", err);
                    // fallback: alleen luisteren
                    onValue(counterRef, (snapshot) => {
                        const data = snapshot.val();
                        const count = data?.count ?? 0;
                        countEl.textContent = count;
                    });
                });
        }


        // ─── 8. START APP ──────────────────────────────────
        async function init() {
            // 8a. Laad teachers (uit Firestore of fallback)
            const teachers = await seedFirestoreIfEmpty();
            renderCards(teachers);

            // 8b. Start visitor counter (Realtime DB)
            setupVisitorCounter();
        }

        init();
    </script>

</body>
