<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ============================================================
               ALL STYLES — PRESERVED, with minor additions for info rows
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
            background:
                radial-gradient(circle at 20% 20%, rgba(20, 184, 166, 0.18), transparent 40%),
                radial-gradient(circle at 80% 30%, rgba(249, 115, 22, 0.15), transparent 45%),
                radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.10), transparent 40%),
                linear-gradient(135deg, #fefcfb, #f1f5f9);
        }

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.18), transparent 70%);
            top: -150px;
            left: -150px;
            filter: blur(55px);
            animation: float 10s infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.15), transparent 70%);
            bottom: -150px;
            right: -150px;
            filter: blur(55px);
            animation: float2 12s infinite alternate;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(70px, 50px);
            }
        }

        @keyframes float2 {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(-70px, -50px);
            }
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            padding: 1.2rem 2rem;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(20, 184, 166, 0.15);
            gap: 1rem;
        }

        .header h1 {
            font-weight: 700;
            font-size: 1.9rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 i {
            color: #14b8a6;
            font-size: 2rem;
        }

        .header .badge {
            background: rgba(249, 115, 22, 0.12);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            color: #f97316;
            font-size: 0.95rem;
        }

        .header .badge a {
            color: inherit;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .header .badge a:hover {
            text-decoration: underline;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 0.4rem 0.4rem 0.4rem 1.2rem;
            border: 1px solid rgba(20, 184, 166, 0.20);
            transition: border-color 0.3s, box-shadow 0.3s;
            flex: 1 1 240px;
            min-width: 160px;
            max-width: 340px;
        }

        .search-wrapper:focus-within {
            border-color: #14b8a6;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.12);
        }

        .search-wrapper i {
            color: #14b8a6;
            font-size: 0.95rem;
            opacity: 0.7;
            margin-right: 8px;
        }

        .search-wrapper input {
            border: none;
            outline: none;
            background: transparent;
            padding: 0.6rem 0;
            font-size: 0.95rem;
            width: 100%;
            color: #0f172a;
        }

        .search-wrapper input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .search-wrapper .clear-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 8px;
            display: none;
            transition: color 0.2s;
        }

        .search-wrapper .clear-btn:hover {
            color: #f97316;
        }

        .search-wrapper .clear-btn.visible {
            display: block;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        .subject-card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            transition: 0.25s ease;
            border: 1px solid rgba(20, 184, 166, 0.15);
            cursor: default;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            border-color: #f97316;
            box-shadow: 0 18px 40px rgba(249, 115, 22, 0.12);
        }

        .image-wrapper {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #e3f2f1;
            position: relative;
            overflow: hidden;
            border-bottom: 2px solid rgba(20, 184, 166, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        .image-wrapper .fallback-icon {
            font-size: 3.5rem;
            color: #14b8a6;
            opacity: 0.3;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .card-content {
            padding: 1.2rem;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .card-header h3 {
            font-size: 1.1rem;
            color: #0f172a;
            font-weight: 700;
            flex: 1;
            min-width: 80px;
        }

        .subject-code {
            background: rgba(20, 184, 166, 0.12);
            color: #14b8a6;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* ----- info rows: phone, dept, address ----- */
        .info-rows {
            margin-top: 0.7rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: #1e293b;
            line-height: 1.4;
        }

        .info-row i {
            width: 1.1rem;
            font-size: 0.75rem;
            color: #14b8a6;
            opacity: 0.7;
            text-align: center;
            flex-shrink: 0;
        }

        .info-row .label {
            color: #64748b;
            font-weight: 500;
            margin-right: 2px;
            flex-shrink: 0;
        }

        .info-row .value {
            color: #0f172a;
            font-weight: 500;
            word-break: break-word;
        }

        .info-row .value.muted {
            color: #94a3b8;
            font-weight: 400;
            font-style: italic;
        }

        /* ------------------------------------------------ */

        .card-footer {
            margin-top: 10px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 10px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        /* department label in footer — now shows dept name */
        .dept-label {
            font-size: 0.7rem;
            color: #f97316;
            background: rgba(249, 115, 22, 0.10);
            padding: 0.25rem 1rem;
            border-radius: 30px;
            font-weight: 500;
        }

        /* hide old .student-dept */
        .student-dept {
            display: none;
        }

        .state-message {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            border: 1px solid rgba(20, 184, 166, 0.12);
            min-height: 300px;
            gap: 1rem;
        }

        .state-message i {
            font-size: 3.5rem;
            color: #14b8a6;
            opacity: 0.5;
        }

        .state-message .spinner {
            font-size: 2.8rem;
            color: #14b8a6;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .state-message h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0f172a;
        }

        .state-message p {
            color: #64748b;
            max-width: 360px;
            font-size: 0.95rem;
        }

        .state-message .error-icon {
            color: #ef4444;
            opacity: 0.7;
        }

        .state-message .retry-btn {
            margin-top: 0.5rem;
            background: rgba(249, 115, 22, 0.12);
            color: #f97316;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .state-message .retry-btn:hover {
            background: rgba(249, 115, 22, 0.20);
        }

        @media (max-width: 680px) {
            .subject-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                padding: 1.2rem 1.2rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .search-wrapper {
                max-width: 100%;
                flex: 1 1 auto;
            }

            .header .badge {
                align-self: flex-start;
            }
        }

        @media (max-width: 420px) {
            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .card-header .subject-code {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- HEADER -->
        <div class="header">
            <h1><i class="fas fa-users"></i> Students</h1>

            <!-- Search Bar -->
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by name, roll, dept…" aria-label="Search students" />
                <button class="clear-btn" id="clearSearchBtn" aria-label="Clear search">
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>

            <span class="badge">
                <i class="fa fa-graduation-cap"></i>
                <a href="https://www.nu.ac.bd/Syllabus/Syllabus_Honours/BBA_Honours/Finance_and_Banking_First_Year_Pub_Date_12112025.pdf" target="_blank">Syllabus</a>
            </span>
        </div>

        <!-- Student Grid -->
        <div class="subject-grid" id="studentGrid"></div>

    </div>

    <!-- ============================================================= -->
    <!-- FIREBASE — ES Module (v11+)                                    -->
    <!-- ============================================================= -->
    <script type="module">
        // ================================================================
        //  1)  FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyA0fKdqe8ZQUK-Ys2L6Gm5x53i2ZdyOjrE",
            authDomain: "hbuc-student.firebaseapp.com",
            projectId: "hbuc-student",
            storageBucket: "hbuc-student.firebasestorage.app",
            messagingSenderId: "370097429274",
            appId: "1:370097429274:web:9f6e78032af050eddbaaa3",
            databaseURL: "https://hbuc-student-default-rtdb.firebaseio.com"
        };

        // ================================================================
        //  2)  IMPORTS  — Firebase v11+ (CDN)
        // ================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            onSnapshot,
            query,
            orderBy,
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
        import {
            getDatabase
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

        // ================================================================
        //  3)  INITIALIZE
        // ================================================================
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);
        console.log("✅ Firebase Connected Successfully");
        console.log("✅ Firestore Ready");
        console.log("✅ Realtime Database Ready");

        // ================================================================
        //  4)  DOM REFS
        // ================================================================
        const grid = document.getElementById("studentGrid");
        const searchInput = document.getElementById("searchInput");
        const clearBtn = document.getElementById("clearSearchBtn");

        // ================================================================
        //  5)  STATE
        // ================================================================
        let allStudents = [];
        let filteredStudents = [];
        let unsubscribe = null;
        let isFirstLoad = true;

        // ================================================================
        //  6)  XSS SAFETY
        // ================================================================
        function escapeHtml(text) {
            if (text == null) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, function(m) {
                return map[m];
            });
        }

        // ================================================================
        //  7)  RENDER  — builds cards with Roll (as "Roll: 123"), Phone, Dept, Address
        //               and footer shows department name (or "Student")
        // ================================================================
        function renderStudents(list) {
            grid.innerHTML = '';

            if (!list || list.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'state-message';
                empty.innerHTML = `
                    <i class="fas fa-user-graduate"></i>
                    <h2>No students found</h2>
                    <p>Students added from the Admin Panel will appear here automatically.</p>
                `;
                grid.appendChild(empty);
                return;
            }

            list.forEach((student) => {
                const card = document.createElement('div');
                card.className = 'subject-card';

                // ---- image wrapper ----
                const wrapper = document.createElement('div');
                wrapper.className = 'image-wrapper';

                const hasImage = student.image && student.image.trim() !== '';

                const img = document.createElement('img');
                img.alt = escapeHtml(student.name) || 'Student';

                const icon = document.createElement('i');
                icon.className = 'fas fa-user fallback-icon';

                if (hasImage) {
                    img.src = student.image;
                    icon.style.display = 'none';
                    img.onload = function() {
                        icon.style.display = 'none';
                        img.style.display = 'block';
                    };
                    img.onerror = function() {
                        img.style.display = 'none';
                        icon.style.display = 'block';
                        img.src = '';
                    };
                } else {
                    img.style.display = 'none';
                    icon.style.display = 'block';
                    img.src = '';
                }

                wrapper.appendChild(img);
                wrapper.appendChild(icon);

                // ---- card content ----
                const content = document.createElement('div');
                content.className = 'card-content';

                // header: Name + Roll (now with "Roll:" prefix)
                const header = document.createElement('div');
                header.className = 'card-header';

                const nameEl = document.createElement('h3');
                nameEl.textContent = student.name || 'Unnamed';

                const rollEl = document.createElement('span');
                rollEl.className = 'subject-code';
                // show "Roll: 123" format
                const rollText = student.roll && student.roll.trim() ? `Roll: ${student.roll}` : 'Roll: —';
                rollEl.textContent = rollText;

                header.appendChild(nameEl);
                header.appendChild(rollEl);

                // ---- info rows: Phone, Department, Address ----
                const infoRows = document.createElement('div');
                infoRows.className = 'info-rows';

                // Phone
                const phoneRow = document.createElement('div');
                phoneRow.className = 'info-row';
                const phoneIcon = document.createElement('i');
                phoneIcon.className = 'fas fa-phone';
                const phoneLabel = document.createElement('span');
                phoneLabel.className = 'label';
                phoneLabel.textContent = 'Phone:';
                const phoneValue = document.createElement('span');
                phoneValue.className = 'value';
                phoneValue.textContent = student.phone && student.phone.trim() ? student.phone : '—';
                phoneRow.appendChild(phoneIcon);
                phoneRow.appendChild(phoneLabel);
                phoneRow.appendChild(phoneValue);

                // Department
                const deptRow = document.createElement('div');
                deptRow.className = 'info-row';
                const deptIcon = document.createElement('i');
                deptIcon.className = 'fas fa-building';
                const deptLabel = document.createElement('span');
                deptLabel.className = 'label';
                deptLabel.textContent = 'Department:';
                const deptValue = document.createElement('span');
                deptValue.className = 'value';
                deptValue.textContent = student.department && student.department.trim() ? student.department : '—';
                deptRow.appendChild(deptIcon);
                deptRow.appendChild(deptLabel);
                deptRow.appendChild(deptValue);

                // Address
                const addrRow = document.createElement('div');
                addrRow.className = 'info-row';
                const addrIcon = document.createElement('i');
                addrIcon.className = 'fas fa-location-dot';
                const addrLabel = document.createElement('span');
                addrLabel.className = 'label';
                addrLabel.textContent = 'Address:';
                const addrValue = document.createElement('span');
                addrValue.className = 'value';
                addrValue.textContent = student.address && student.address.trim() ? student.address : '—';
                addrRow.appendChild(addrIcon);
                addrRow.appendChild(addrLabel);
                addrRow.appendChild(addrValue);

                infoRows.appendChild(phoneRow);
                infoRows.appendChild(deptRow);
                infoRows.appendChild(addrRow);

                // ---- footer: show department name (or "Student" if missing) ----
                const footer = document.createElement('div');
                footer.className = 'card-footer';
                const deptLabelFooter = document.createElement('span');
                deptLabelFooter.className = 'dept-label';
                // if department exists, show it; otherwise fallback to "Student"
                const deptDisplay = student.department && student.department.trim() ? student.department : 'Student';
                deptLabelFooter.textContent = deptDisplay;
                footer.appendChild(deptLabelFooter);

                // assemble
                content.appendChild(header);
                content.appendChild(infoRows);
                content.appendChild(footer);

                card.appendChild(wrapper);
                card.appendChild(content);

                grid.appendChild(card);
            });
        }

        // ================================================================
        //  8)  SEARCH
        // ================================================================
        function applySearch(term) {
            const q = term.trim().toLowerCase();
            if (!q) {
                filteredStudents = [...allStudents];
            } else {
                filteredStudents = allStudents.filter((s) => {
                    const name = (s.name || '').toLowerCase();
                    const roll = (s.roll || '').toLowerCase();
                    const dept = (s.department || '').toLowerCase();
                    const year = (s.year || '').toLowerCase();
                    const phone = (s.phone || '').toLowerCase();
                    const address = (s.address || '').toLowerCase();
                    return (
                        name.includes(q) ||
                        roll.includes(q) ||
                        dept.includes(q) ||
                        year.includes(q) ||
                        phone.includes(q) ||
                        address.includes(q)
                    );
                });
            }
            renderStudents(filteredStudents);

            if (q.length > 0) {
                clearBtn.classList.add('visible');
            } else {
                clearBtn.classList.remove('visible');
            }
        }

        // ================================================================
        //  9)  LOADING / ERROR
        // ================================================================
        function showLoading() {
            grid.innerHTML = `
                <div class="state-message">
                    <i class="fas fa-spinner spinner"></i>
                    <h2>Loading students…</h2>
                    <p>Please wait while we fetch the latest data.</p>
                </div>
            `;
        }

        function showError(err) {
            const msg = getUserFriendlyError(err);
            console.error('❌ Firestore Error:', err);
            grid.innerHTML = `
                <div class="state-message">
                    <i class="fas fa-exclamation-triangle error-icon"></i>
                    <h2>${msg.title}</h2>
                    <p>${msg.message}</p>
                    <button class="retry-btn" id="retryBtn">
                        <i class="fas fa-redo" style="margin-right:6px;"></i>Retry
                    </button>
                </div>
            `;
            const retryBtn = document.getElementById('retryBtn');
            if (retryBtn) {
                retryBtn.addEventListener('click', () => {
                    startListening();
                });
            }
        }

        function getUserFriendlyError(err) {
            const code = err?.code || '';
            if (code === 'permission-denied') {
                return {
                    title: 'Access Denied',
                    message: 'You do not have permission to read student data. Please check your Firestore security rules.'
                };
            }
            if (code === 'failed-precondition' || code === 'not-found') {
                return {
                    title: 'Missing Index',
                    message: 'A required Firestore index is missing. Please create the index from the Firebase console.'
                };
            }
            if (code === 'unavailable' || code === 'deadline-exceeded') {
                return {
                    title: 'Network Error',
                    message: 'The network is unavailable or slow. Please check your connection and try again.'
                };
            }
            if (code === 'cancelled') {
                return {
                    title: 'Request Cancelled',
                    message: 'The request was cancelled. Please try again.'
                };
            }
            return {
                title: 'Something went wrong',
                message: err.message || 'Could not load students. Please try again later.'
            };
        }

        // ================================================================
        //  10)  START LISTENING
        // ================================================================
        function startListening() {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }

            showLoading();

            const studentsCol = collection(db, 'students');
            const q = query(studentsCol, orderBy('createdAt', 'desc'));

            try {
                unsubscribe = onSnapshot(
                    q,
                    (snapshot) => {
                        const students = [];
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            students.push({
                                id: doc.id,
                                name: data.name || '',
                                roll: data.roll || '',
                                year: data.year || '',
                                department: data.department || '',
                                phone: data.phone || '',
                                address: data.address || '',
                                image: data.image || '',
                                createdAt: data.createdAt || null,
                            });
                        });

                        allStudents = students;
                        const currentTerm = searchInput.value || '';
                        applySearch(currentTerm);

                        if (isFirstLoad) {
                            console.log(`✅ Students Loaded Successfully (${allStudents.length} records)`);
                            isFirstLoad = false;
                        } else {
                            console.log(`🔄 Students Updated (${allStudents.length} records)`);
                        }
                    },
                    (error) => {
                        if (error.code === 'cancelled') return;
                        showError(error);
                    }
                );
            } catch (err) {
                showError(err);
            }
        }

        // ================================================================
        //  11)  SEARCH EVENT BINDING
        // ================================================================
        searchInput.addEventListener('input', (e) => {
            applySearch(e.target.value);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            applySearch('');
            clearBtn.classList.remove('visible');
            searchInput.focus();
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                applySearch('');
                clearBtn.classList.remove('visible');
                searchInput.blur();
            }
        });

        // ================================================================
        //  12)  GO
        // ================================================================
        startListening();
