<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 অ্যাডমিন · নোটিশ বোর্ড</title>

    <!-- Firebase SDKs (v9 modular) -->
    <script type="module">
        // ----- Firebase Import & Config -----
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics.js";
        import { 
            getFirestore, 
            collection, 
            getDocs, 
            addDoc, 
            deleteDoc, 
            doc,
            orderBy,
            query,
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // 🔥 আপনার Firebase config (প্রতিস্থাপন করুন)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyReplaceWithYourOwn",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456",
            measurementId: "G-XXXXXXXX"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // DOM refs
        const form = document.getElementById('noticeForm');
        const titleInput = document.getElementById('title');
        const textInput = document.getElementById('text');
        const dateInput = document.getElementById('date');
        const imageInput = document.getElementById('imageUrl');
        const noticeList = document.getElementById('noticeList');
        const loadMsg = document.getElementById('loadMsg');

        // ---------- রেন্ডার ফাংশন (Firestore থেকে পড়ে) ----------
        async function renderNotices() {
            try {
                loadMsg.textContent = '⏳ লোড হচ্ছে...';
                const q = query(collection(db, "notices"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                noticeList.innerHTML = '';

                if (querySnapshot.empty) {
                    noticeList.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:#64748b;">📭 কোনো নোটিশ নেই</td></tr>`;
                    loadMsg.textContent = '✅ সর্বশেষ নোটিশ';
                    return;
                }

                let counter = 1;
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const title = data.title || 'শিরোনাম নেই';
                    const text = data.text || 'বিবরণ নেই';
                    const date = data.date || 'তারিখ নেই';
                    const imageUrl = data.imageUrl || 'images/notice1.jpg';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${counter++}</td>
                        <td><strong>${title}</strong></td>
                        <td>${text}</td>
                        <td>${date}</td>
                        <td>
                            <button class="delete-btn" data-id="${id}" style="background:#fee2e2; border:none; padding:6px 16px; border-radius:40px; font-weight:600; color:#b91c1c; cursor:pointer; transition:0.15s;">🗑️ ডিলিট</button>
                        </td>
                    `;
                    noticeList.appendChild(tr);
                });

                // প্রতি ডিলিট বাটনে আলাদা ইভেন্ট লিসেনার (প্রতিটি আলাদা)
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = btn.dataset.id;
                        if (confirm('এই নোটিশটি স্থায়ীভাবে ডিলিট করবেন?')) {
                            try {
                                await deleteDoc(doc(db, "notices", id));
                                renderNotices(); // রিফ্রেশ
                            } catch (error) {
                                alert('ডিলিট করতে সমস্যা: ' + error.message);
                            }
                        }
                    });
                });

                loadMsg.textContent = '✅ সর্বশেষ নোটিশ';

            } catch (error) {
                console.error("রেন্ডার ত্রুটি:", error);
                loadMsg.textContent = '⚠️ ডেটা লোড করতে ব্যর্থ';
                noticeList.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#b91c1c;">🔥 Firebase সংযোগ সমস্যা। config চেক করুন।</td></tr>`;
            }
        }

        // ---------- নতুন নোটিশ যোগ করুন ----------
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = titleInput.value.trim();
            const text = textInput.value.trim();
            const date = dateInput.value.trim();
            const imageUrl = imageInput.value.trim() || 'images/notice1.jpg';

            if (!title || !text || !date) {
                alert('শিরোনাম, বিবরণ ও তারিখ অবশ্যই দিতে হবে।');
                return;
            }

            try {
                await addDoc(collection(db, "notices"), {
                    title,
                    text,
                    date,
                    imageUrl,
                    createdAt: serverTimestamp()
                });

                form.reset();
                renderNotices(); 
                alert('✅ নোটিশ সফলভাবে যোগ করা হয়েছে!');

            } catch (error) {
                alert('যোগ করতে ব্যর্থ: ' + error.message);
                console.error(error);
            }
        });

        // ---------- শুরুতে রেন্ডার ----------
        renderNotices();

        window.__db = db;
        console.log("✅ Firebase Admin Panel ready. প্রতিটি নোটিশ আলাদাভাবে ডিলিট করা যায়!");
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 30px 20px;
            background:
                radial-gradient(circle at top left, #818cf8 0%, transparent 35%),
                radial-gradient(circle at bottom right, #60a5fa 0%, transparent 35%),
                linear-gradient(145deg, #f1f5f9, #e2e8f0);
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 30px 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            font-size: 2.2rem;
            color: #0f172a;
            font-weight: 700;
        }

        .admin-header small {
            color: #475569;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .form-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            padding: 25px 28px;
            border-radius: 28px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: #1e293b;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group textarea {
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 18px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            transition: 0.2s;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }

        .btn-submit {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            margin-top: 8px;
            height: 52px;
            white-space: nowrap;
        }

        .btn-submit:hover {
            background: #4338ca;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            padding: 6px 2px 10px 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        th {
            text-align: left;
            padding: 16px 12px;
            background: rgba(241, 245, 249, 0.7);
            backdrop-filter: blur(4px);
            color: #0f172a;
            font-weight: 600;
            border-bottom: 2px solid rgba(148, 163, 184, 0.3);
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);
            vertical-align: middle;
            color: #1e293b;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.4);
        }

        .delete-btn {
            background: #fee2e2;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            color: #b91c1c;
            cursor: pointer;
            transition: 0.15s;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #fecaca;
            transform: scale(1.05);
        }

        .load-status {
            margin: 18px 0 10px 0;
            font-size: 14px;
            color: #475569;
            font-weight: 500;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            .admin-container {
                padding: 20px 15px;
            }
            .admin-header h1 {
                font-size: 1.7rem;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .btn-submit {
                width: 100%;
                justify-content: center;
            }
            th,
            td {
                padding: 10px 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="admin-container">

        <!-- হেডার -->
        <div class="admin-header">
            <h1>📋 অ্যাডমিন প্যানেল</h1>
            <small>🔥 Firebase · আলাদা ডিলিট</small>
        </div>

        <!-- নোটিশ যোগ ফর্ম -->
        <div class="form-card">
            <h3 style="margin-bottom: 18px; color: #0f172a;">➕ নতুন নোটিশ যোগ করুন</h3>
            <form id="noticeForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="title">শিরোনাম *</label>
                        <input type="text" id="title" placeholder="যেমন: ছুটির ঘোষণা" required>
                    </div>
                    <div class="form-group">
                        <label for="text">বিবরণ *</label>
                        <textarea id="text" placeholder="বিস্তারিত লেখা..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="date">তারিখ *</label>
                        <input type="text" id="date" placeholder="১ জুলাই ২০২৬" required>
                    </div>
                    <div class="form-group">
                        <label for="imageUrl">ছবির URL (ঐচ্ছিক)</label>
                        <input type="text" id="imageUrl" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group" style="grid-column: span 1; display: flex; align-items: flex-end;">
                        <button type="submit" class="btn-submit">➕ প্রকাশ করুন</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- নোটিশ তালিকা -->
        <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap;">
            <h3 style="color: #0f172a; margin-bottom: 8px;">📌 সকল নোটিশ</h3>
            <span class="load-status" id="loadMsg">⏳ লোড হচ্ছে...</span>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>শিরোনাম</th>
                        <th>বিবরণ</th>
                        <th>তারিখ</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="noticeList">
                    <tr><td colspan="5" style="text-align:center; padding:30px; color:#64748b;">⏳ ডেটা আনতে হচ্ছে...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- লিংক: মূল পেজে ফিরে যান -->
        <a href="#" class="back-link" onclick="alert('মূল নোটিশ বোর্ড পেজে যেতে চাইলে URL পরিবর্তন করুন।'); return false;">← মূল নোটিশ বোর্ড</a>

        <div style="margin-top: 20px; font-size: 13px; color: #64748b; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 18px; text-align: center;">
            ⚡ Firebase Firestore · প্রতিটি নোটিশ আলাদাভাবে ডিলিট করা যায় <br>
            <span style="background: #e2e8f0; padding: 2px 14px; border-radius: 30px; font-size:12px;">Firebase config প্রতিস্থাপন করুন</span>
        </div>
    </div>

</body>
</html>
